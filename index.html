<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leo Club of Piliyandala — Launching</title>
<meta name="description" content="Leo District 306 D2 Project Web Weavers — launch page for Leo Club of Piliyandala.">
<link rel="stylesheet" href="launch.css">
<style>
  :root {
    --bg: #0f1d3a;
    --bg2: #0a1529;
    --ink: #0f1d3a;
    --on-ink: #f4f6f8;
    --accent: #c9a227;
    --accent2: #ffffff;
  }
</style>
</head>
<body>
  <div class="stage-bg"></div>
  <div class="stage-grid"></div>
  <canvas id="burst"></canvas>

  <button class="sound-toggle" aria-label="Toggle launch sound"></button>

  <main class="stage">
    <p class="eyebrow"><span class="dot"></span> Leo District 306 D2 &middot; Project Web Weavers</p>

    <div class="crest">
      <span class="initial">P</span>
    </div>

    <h1 class="club-name">Leo Club of Piliyandala</h1>
    <p class="theme-line">Civic, modern, Piliyandala.</p>

    <p class="status">
      <span class="pre">Ready to launch</span>
      <span class="live"><span class="dot"></span> Site is live</span>
    </p>

    <button class="launch-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
      <span>Launch this site</span>
    </button>

    <div class="cta">
      <span class="soon">Website coming soon</span>
    </div>
  </main>
  <script>
    window.LAUNCH_CONFIG = {
      name: "Leo Club of Piliyandala",
      accent: "#c9a227",
      accent2: "#ffffff",
      music: { waveform: "sine", root: 523, scale: [0, 3, 7, 10, 12], tempoMs: 130, chordHold: 1100 }
    };
  </script>
  <script src="launch.js"></script>
</body>
</html>
